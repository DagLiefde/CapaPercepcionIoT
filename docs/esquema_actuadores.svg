<text x="30" y="670" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Notas</text>
<text x="30" y="687" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">1. El servo se alimenta con el pin de 5 V del Arduino Mega (alimentado por USB); no usar el pin 3V3 del ESP32. Unir los GND del Mega y del ESP32.</text>
<text x="30" y="704" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">2. El consumo total (servo + sensores) debe ser menor al límite de la fuente USB del Arduino Mega.</text>
<text x="30" y="721" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">3. GPIO23 genera la señal PWM del servo (LEDC, 50 Hz, pulso 1100-1900 µs), conectada directamente al servo.</text>
<text x="30" y="738" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">4. Cada LED va con el ánodo al GPIO y el cátodo a GND a través de una resistencia de 220 Ω (~2-6 mA a 3.3 V según el color).</text>
<text x="30" y="755" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">5. Lógica del firmware (aforo máx. 10): verde &lt; 8 personas, amarillo 8-9, rojo ≥ 10 y barrera cerrada.</text>
</svg>
