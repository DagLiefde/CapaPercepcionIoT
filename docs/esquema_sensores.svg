<text x="220" y="612" font-size="12" text-anchor="start" fill="#555" font-style="italic" font-family="DejaVu Sans, Arial, sans-serif">nodo del divisor → GPIO34 (ADC1_CH6)</text>
<line x1="640" y1="620" x2="640" y2="620" stroke="#222" stroke-width="2" stroke-linecap="round"/>
<text x="652" y="624" font-size="13" text-anchor="start" fill="#111" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">GPIO34</text>
<text x="300" y="730" font-size="11.5" text-anchor="start" fill="#111" font-weight="bold" font-family="DejaVu Sans, Arial, sans-serif">Notas</text>
<text x="300" y="747" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">1. Los E18-D80NK se alimentan con el pin de 5 V del Arduino Mega (alimentado por USB).</text>
<text x="300" y="764" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">&#160;&#160;&#160;&#160; Su salida es NPN colector abierto: el pull-up (R1, R2) va a 3V3, nunca a 5 V.</text>
<text x="300" y="781" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">2. Salida en LOW = objeto detectado. Entradas digitales: GPIO18 (sensor A) y GPIO19 (sensor B).</text>
<text x="300" y="798" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">&#160;&#160;&#160;&#160; El firmware desactiva los pull-up internos, por lo que los de 10 kΩ externos son obligatorios.</text>
<text x="300" y="815" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">3. GPIO34 es solo entrada y pertenece a ADC1, por lo que funciona aunque el Wi-Fi esté activo.</text>
<text x="300" y="832" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">4. Unir el GND de los sensores, del LDR, del Arduino Mega y del ESP32 (GND común).</text>
<text x="300" y="849" font-size="11.5" text-anchor="start" fill="#111" font-family="DejaVu Sans, Arial, sans-serif">5. Separar los sensores A y B unos 10-15 cm en el sentido de paso y ajustar el alcance con el potenciómetro.</text>
</svg>
